name: Deploy to Cloudflare Pages

# Deploys the approved main version to Cloudflare Pages (https://klode.pages.dev)
# after the Application checks pass on main. No branch or PR previews: see
# docs/hosting.md. Netlify (https://klode.app) is deployed separately.
#
# One-time setup by the product owner:
#   - Cloudflare Pages project "klode" with production branch "main"
#   - repository secrets CLOUDFLARE_API_TOKEN ("Cloudflare Pages: Edit")
#     and CLOUDFLARE_ACCOUNT_ID

on:
  workflow_run:
    workflows: [Application]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved main
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://klode.pages.dev/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned npm and locked dependencies
        run: |
          npm install --global "$(node --input-type=module -e 'import p from "./package.json" with {type: "json"}; console.log(p.packageManager)')"
          npm ci
      - name: Build static application and verified runtime
        run: npm run build
      - name: Add Cloudflare Pages headers
        run: cp cloudflare/_headers dist/_headers
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=klode --branch=main --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify isolation headers and runtime MIME types
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          wasm="$(cd dist && ls runtime/*/pyodide.asm.wasm)"
          worker="$(cd dist && ls assets/worker-*.js | head -n 1)"
          check() {
            headers="$(curl -fsSI "$base/$1" | tr -d '\r')"
            grep -qix 'cross-origin-opener-policy: same-origin' <<<"$headers"
            grep -qix 'cross-origin-embedder-policy: require-corp' <<<"$headers"
            if [ -n "${2:-}" ]; then grep -qi "^content-type: $2" <<<"$headers"; fi
            echo "OK $1"
          }
          check ''
          check "$worker" 'text/javascript\|application/javascript'
          check "$wasm" 'application/wasm'
